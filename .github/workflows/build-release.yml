name: SuperR7 release candidate
run-name: Build SuperR7 release candidate

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'Luna*'

permissions:
  contents: write

jobs:
  host-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc lcov python3-pil

      - name: Run host tests
        run: |
          make -C tests
          python3 -m unittest discover -s tests -p '*_test.py'

  build-candidate:
    needs: host-tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: sd
            flavour: SD
            max_bytes: 524288
          - board: chis
            flavour: Chis
            max_bytes: 2097152

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ gcc-arm-none-eabi python3

      - name: Build SuperR7 for ${{ matrix.flavour }}
        run: |
          make BOARD=${{ matrix.board }} clean
          make BOARD=${{ matrix.board }} COMPRESSION_RATIO=10 superr7.gba

      - name: Verify and package candidate
        shell: bash
        run: |
          python3 tools/verify_firmware_image.py \
            --max-bytes ${{ matrix.max_bytes }} \
            --flavour ${{ matrix.flavour }} \
            superr7.gba

          if [[ "$GITHUB_REF" == refs/tags/Luna* ]]; then
            base="SuperR7-${{ matrix.flavour }}-${GITHUB_REF_NAME}"
          else
            base="SuperR7-${{ matrix.flavour }}-${GITHUB_SHA:0:8}"
          fi

          mkdir -p dist
          cp superr7.gba "dist/$base.gba"
          cp superr7.gba "dist/$base.fw"
          sha256sum "dist/$base.gba" "dist/$base.fw" > "dist/$base.sha256"
          printf 'board=%s\nflavour=%s\nsize=%s\ncommit=%s\n' \
            '${{ matrix.board }}' '${{ matrix.flavour }}' \
            "$(stat -c %s superr7.gba)" "$GITHUB_SHA" \
            > "dist/$base.build-info.txt"

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: superr7-candidate-${{ matrix.board }}-${{ github.sha }}
          path: dist/*

  draft-release:
    needs: build-candidate
    if: startsWith(github.ref, 'refs/tags/Luna')
    runs-on: ubuntu-24.04

    steps:
      - name: Download candidates
        uses: actions/download-artifact@v4
        with:
          pattern: superr7-candidate-*-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Create draft release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --generate-notes \
            --title "SuperR7 $GITHUB_REF_NAME" \
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
