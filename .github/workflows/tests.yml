name: SuperR7 tests
run-name: Build and run SuperR7 tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc lcov python3-pil

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run C tests
        run: make -C tests

      - name: Test cover converters and formats
        run: python3 -m unittest discover -s tests -p '*_test.py'

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: superr7-test-coverage-${{ github.sha }}
          path: tests/coverage/*

  firmware-builds:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: sd
            flavour: SD
            max_bytes: 524288
          - board: chis
            flavour: Chis
            max_bytes: 2097152

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y g++ gcc-arm-none-eabi python3

      - name: Build and verify ${{ matrix.flavour }} firmware
        run: |
          make BOARD=${{ matrix.board }} clean
          make BOARD=${{ matrix.board }} COMPRESSION_RATIO=10 superr7.gba
          python3 tools/verify_firmware_image.py \
            --max-bytes ${{ matrix.max_bytes }} \
            --flavour ${{ matrix.flavour }} \
            superr7.gba
