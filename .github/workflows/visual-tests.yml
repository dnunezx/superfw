name: SuperR7 visual tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  mgba-visual-tests:
    runs-on: ubuntu-24.04

    steps:
      - name: Install build and visual-test dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi curl python3-pil

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build emulator demos
        run: |
          make BOARD=sd cover-demo-v3.gba
          make BOARD=sd ingame-menu-demo.gba

      - name: Install official mGBA development headless build
        run: |
          curl -fsSL https://s3.amazonaws.com/mgba/mGBA-build-latest-ubuntu64-noble.tar.xz -o /tmp/mgba.tar.xz
          mkdir -p /tmp/mgba
          tar -xf /tmp/mgba.tar.xz -C /tmp/mgba
          sudo apt-get install -y \
            "$(find /tmp/mgba -name libmgba.deb -print -quit)" \
            "$(find /tmp/mgba -name mgba-headless.deb -print -quit)"
          dpkg-query -W -f='${Version}\n' mgba-headless

      - name: Capture and verify cover states
        run: |
          mkdir -p artifacts/cover-demo-v3
          timeout 15s mgba-headless --script tools/mgba-cover-demo-v3.lua cover-demo-v3.gba || test -f artifacts/cover-demo-v3/complete.txt
          test -f artifacts/cover-demo-v3/complete.txt
          PYTHONPATH=. python3 tests/cover_demo_v3_visual.py

      - name: Capture and verify Browse View and Sort
        run: |
          mkdir -p artifacts/view-sort-v3
          timeout 18s mgba-headless --script tools/mgba-view-sort-v3.lua cover-demo-v3.gba || test -f artifacts/view-sort-v3/complete.txt
          test -f artifacts/view-sort-v3/complete.txt
          python3 tests/view_sort_visual.py

      - name: Capture and verify in-game-menu states
        run: |
          mkdir -p artifacts/ingame-menu
          timeout 85s mgba-headless --script tools/mgba-ingame-menu.lua ingame-menu-demo.gba || test -f artifacts/ingame-menu/complete.txt
          test -f artifacts/ingame-menu/complete.txt
          PYTHONPATH=. python3 tests/ingame_menu_visual.py

      - name: Upload demos and reference screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: superr7-mgba-visuals-${{ github.sha }}
          path: |
            cover-demo-v3.gba
            firmware.demo.v3.ewram.elf
            firmware.demo.v3.ewram.map
            artifacts/cover-demo-v3/*
            artifacts/view-sort-v3/*
            ingame-menu-demo.gba
            firmware.ingame.demo.ewram.elf
            firmware.ingame.demo.ewram.map
            artifacts/ingame-menu/*
